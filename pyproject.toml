[project]
name = "megacontext"
version = "0.1.0"
description = "Extend any LLM to million-token contexts via embedding retrieval"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Austin DeWolfe", email = "austindewolfe@gmail.com"}]
dependencies = [
    "torch>=2.0",
    "numpy",
    "transformers",
    "safetensors",
    "huggingface-hub",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
